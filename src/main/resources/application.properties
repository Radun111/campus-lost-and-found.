# ============================================================
#  Real passwords are NOT stored here.
#  Put them in src/main/resources/application-local.properties
#  (that file is in .gitignore, so it never goes to GitHub).
# ============================================================
spring.config.import=optional:classpath:application-local.properties

# JWT Configuration
jwt.secret=CHANGE_ME_IN_APPLICATION_LOCAL
jwt.expiration=86400000
jwt.refresh-expiration=604800000
app.jwt.refresh-expiration-ms=604800000

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/lost_and_found_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=CHANGE_ME_IN_APPLICATION_LOCAL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=CHANGE_ME_IN_APPLICATION_LOCAL
spring.mail.password=CHANGE_ME_IN_APPLICATION_LOCAL
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
